[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "y2mp3"
version = "0.1.1"
description = "Interactive audio and video downloads for Termux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Dmytro Petunenko"}]
dependencies = ["yt-dlp>=2026.6.9", "rich>=14,<16"]

[project.optional-dependencies]
dev = ["yt-dlp[default]>=2026.6.9", "pytest>=8,<10", "ruff>=0.11", "build>=1.2"]

[project.scripts]
y2mp3 = "y2mp3.cli:main"

[project.urls]
Homepage = "https://github.com/dimkabuki/y2mp3"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra -m 'not network'"
markers = ["network: requires external media access (excluded by default)"]
