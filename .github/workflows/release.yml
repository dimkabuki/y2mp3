name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: termux-deb
          path: dist
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "y2mp3 $GITHUB_REF_NAME" ./y2mp3.deb SHA256SUMS
